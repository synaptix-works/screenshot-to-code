[package]
name = "s2c-axon"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Rust headless adapter for synaptix-works/screenshot-to-code"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
futures-util = "0.3"
mime_guess = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.28", features = ["native-tls"] }

[workspace]

[dev-dependencies]
tempfile = "3"
